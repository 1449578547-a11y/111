<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹈鹕骑自行车 🚲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #eef3f7;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 20px; color: #37474f; letter-spacing: 2px; }
  .stage { width: min(920px, 94vw); }
  svg {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(30, 60, 90, .25);
  }

  .cloud { animation: drift linear infinite; }
  .c1 { animation-duration: 42s; }
  .c2 { animation-duration: 60s; animation-delay: -25s; }
  .c3 { animation-duration: 78s; animation-delay: -55s; }
  @keyframes drift { to { transform: translateX(-1250px); } }

  .tufts { animation: slide 0.4s linear infinite; }
  @keyframes slide { to { transform: translateX(-100px); } }

  .road-line { animation: road 0.19s linear infinite; }
  @keyframes road { to { stroke-dashoffset: 48; } }

  .sun-rays {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 36s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fish {
    transform-box: fill-box;
    transform-origin: 70% 50%;
    animation: wiggle 0.5s ease-in-out infinite alternate;
  }
  @keyframes wiggle { from { transform: rotate(-10deg); } to { transform: rotate(12deg); } }

  @media (prefers-reduced-motion: reduce) {
    .cloud, .tufts, .road-line, .sun-rays, .fish { animation: none; }
  }
</style>
</head>
<body>
  <h1>🪶 鹈鹕的周末骑行 🚲</h1>
  <div class="stage">
    <svg id="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只戴安全帽的鹈鹕骑着自行车的 2D 动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6ec1ff"/>
          <stop offset="0.7" stop-color="#bfe6ff"/>
          <stop offset="1" stop-color="#eaf8ff"/>
        </linearGradient>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#e9eef2"/>
        </linearGradient>
        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe082"/>
          <stop offset="1" stop-color="#ffb74d"/>
        </linearGradient>
        <g id="grassTuft">
          <path d="M0 0 l3 -12 M6 0 l0 -15 M12 0 l-3 -12" stroke="#4e7a27" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
        <g id="flowerTuft">
          <line x1="0" y1="14" x2="0" y2="2" stroke="#33691e" stroke-width="2.5"/>
          <g fill="#ff8a80">
            <circle cx="0" cy="-3" r="3.2"/><circle cx="4.5" cy="1" r="3.2"/><circle cx="-4.5" cy="1" r="3.2"/>
            <circle cx="2.8" cy="5" r="3.2"/><circle cx="-2.8" cy="5" r="3.2"/>
          </g>
          <circle r="2.6" fill="#ffd54f"/>
        </g>
      </defs>

      <!-- 天空 -->
      <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

      <!-- 太阳 -->
      <g transform="translate(672 84)">
        <g class="sun-rays" stroke="#ffd54f" stroke-width="5" stroke-linecap="round">
          <line x1="0" y1="-46" x2="0" y2="-58"/>
          <line x1="32.5" y1="-32.5" x2="41" y2="-41"/>
          <line x1="46" y1="0" x2="58" y2="0"/>
          <line x1="32.5" y1="32.5" x2="41" y2="41"/>
          <line x1="0" y1="46" x2="0" y2="58"/>
          <line x1="-32.5" y1="32.5" x2="-41" y2="41"/>
          <line x1="-46" y1="0" x2="-58" y2="0"/>
          <line x1="-32.5" y1="-32.5" x2="-41" y2="-41"/>
        </g>
        <circle r="34" fill="#ffd54f"/>
        <circle r="27" fill="#ffe082"/>
      </g>

      <!-- 云 -->
      <g transform="translate(180 86)"><g class="cloud c1" fill="#ffffff" opacity="0.95">
        <circle cx="0" cy="0" r="22"/><circle cx="26" cy="-8" r="26"/><circle cx="54" cy="0" r="20"/>
        <rect x="-16" y="-2" width="86" height="20" rx="10"/>
      </g></g>
      <g transform="translate(520 58) scale(0.75)"><g class="cloud c2" fill="#ffffff" opacity="0.9">
        <circle cx="0" cy="0" r="22"/><circle cx="26" cy="-8" r="26"/><circle cx="54" cy="0" r="20"/>
        <rect x="-16" y="-2" width="86" height="20" rx="10"/>
      </g></g>
      <g transform="translate(740 132) scale(0.9)"><g class="cloud c3" fill="#ffffff" opacity="0.85">
        <circle cx="0" cy="0" r="22"/><circle cx="26" cy="-8" r="26"/><circle cx="54" cy="0" r="20"/>
        <rect x="-16" y="-2" width="86" height="20" rx="10"/>
      </g></g>

      <!-- 远山 -->
      <path d="M0 400 L0 330 Q 80 270 170 330 Q 240 280 330 340 Q 430 270 540 345 Q 640 290 720 340 L800 320 L800 400 Z" fill="#b39ddb" opacity="0.45"/>
      <path d="M0 400 L0 362 Q 120 322 240 365 Q 360 332 480 368 Q 620 327 800 370 L800 400 Z" fill="#aed581" opacity="0.6"/>

      <!-- 草地与道路 -->
      <rect x="0" y="370" width="800" height="130" fill="#7cb342"/>
      <rect x="0" y="376" width="800" height="48" fill="#b0bec5"/>
      <line class="road-line" x1="-20" y1="400" x2="820" y2="400" stroke="#ffffff" stroke-width="4" stroke-dasharray="24 24"/>

      <!-- 路边花草（滚动） -->
      <g class="tufts">
        <use href="#grassTuft" x="10" y="374"/><use href="#grassTuft" x="110" y="374"/><use href="#grassTuft" x="210" y="374"/><use href="#grassTuft" x="310" y="374"/><use href="#grassTuft" x="410" y="374"/><use href="#grassTuft" x="510" y="374"/><use href="#grassTuft" x="610" y="374"/><use href="#grassTuft" x="710" y="374"/><use href="#grassTuft" x="810" y="374"/><use href="#grassTuft" x="910" y="374"/>
        <use href="#flowerTuft" x="60" y="436"/><use href="#flowerTuft" x="160" y="436"/><use href="#flowerTuft" x="260" y="436"/><use href="#flowerTuft" x="360" y="436"/><use href="#flowerTuft" x="460" y="436"/><use href="#flowerTuft" x="560" y="436"/><use href="#flowerTuft" x="660" y="436"/><use href="#flowerTuft" x="760" y="436"/><use href="#flowerTuft" x="860" y="436"/>
        <use href="#grassTuft" x="40" y="472"/><use href="#grassTuft" x="140" y="472"/><use href="#grassTuft" x="240" y="472"/><use href="#grassTuft" x="340" y="472"/><use href="#grassTuft" x="440" y="472"/><use href="#grassTuft" x="540" y="472"/><use href="#grassTuft" x="640" y="472"/><use href="#grassTuft" x="740" y="472"/><use href="#grassTuft" x="840" y="472"/><use href="#grassTuft" x="940" y="472"/>
      </g>

      <!-- 车下阴影 -->
      <ellipse cx="400" cy="403" rx="185" ry="8" fill="#000000" opacity="0.12"/>

      <!-- 自行车 -->
      <g id="bike">
        <!-- 后轮 -->
        <circle cx="275" cy="338" r="62" fill="none" stroke="#263238" stroke-width="11"/>
        <circle cx="275" cy="338" r="52" fill="none" stroke="#b0bec5" stroke-width="4"/>
        <g id="spokesRear" stroke="#90a4ae" stroke-width="3">
          <line x1="223" y1="338" x2="327" y2="338"/>
          <line x1="275" y1="286" x2="275" y2="390"/>
          <line x1="238.2" y1="301.2" x2="311.8" y2="374.8"/>
          <line x1="311.8" y1="301.2" x2="238.2" y2="374.8"/>
        </g>
        <circle cx="275" cy="338" r="8" fill="none" stroke="#455a64" stroke-width="4"/>
        <circle cx="275" cy="338" r="6" fill="#455a64"/>
        <!-- 前轮 -->
        <circle cx="525" cy="338" r="62" fill="none" stroke="#263238" stroke-width="11"/>
        <circle cx="525" cy="338" r="52" fill="none" stroke="#b0bec5" stroke-width="4"/>
        <g id="spokesFront" stroke="#90a4ae" stroke-width="3">
          <line x1="473" y1="338" x2="577" y2="338"/>
          <line x1="525" y1="286" x2="525" y2="390"/>
          <line x1="488.2" y1="301.2" x2="561.8" y2="374.8"/>
          <line x1="561.8" y1="301.2" x2="488.2" y2="374.8"/>
        </g>
        <circle cx="525" cy="338" r="6" fill="#455a64"/>
        <!-- 链条 -->
        <line x1="400" y1="324" x2="275" y2="331" stroke="#78909c" stroke-width="3"/>
        <line x1="400" y1="352" x2="275" y2="345" stroke="#78909c" stroke-width="3"/>
        <!-- 车架 -->
        <g stroke="#e63946" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M 365 242 L 275 338"/>
          <path d="M 400 338 L 275 338"/>
          <path d="M 365 242 L 400 338"/>
          <path d="M 400 338 L 502 268"/>
          <path d="M 365 242 L 490 240"/>
        </g>
        <path d="M 486 230 L 506 272" stroke="#c62828" stroke-width="9" stroke-linecap="round"/>
        <path d="M 506 272 L 525 338" stroke="#e63946" stroke-width="6" stroke-linecap="round"/>
        <!-- 车把 -->
        <path d="M 486 230 L 478 202" stroke="#455a64" stroke-width="6" stroke-linecap="round"/>
        <line x1="460" y1="200" x2="498" y2="200" stroke="#455a64" stroke-width="7" stroke-linecap="round"/>
        <!-- 座椅 -->
        <path d="M 348 238 Q 366 228 386 238 L 381 247 L 353 247 Z" fill="#263238"/>
        <!-- 牙盘 -->
        <circle cx="400" cy="338" r="15" fill="#cfd8dc" stroke="#455a64" stroke-width="5"/>
        <circle cx="400" cy="338" r="4.5" fill="#263238"/>
        <!-- 车筐与小鱼 -->
        <path d="M 512 206 L 550 206 L 543 242 L 519 242 Z" fill="#c68642" stroke="#8d5a2b" stroke-width="2.5"/>
        <path d="M 515 216 L 547 216 M 517 226 L 545 226 M 519 236 L 543 236" stroke="#8d5a2b" stroke-width="1.6"/>
        <g transform="translate(531 200)"><g class="fish">
          <path d="M -9 0 L -18 -6 L -15 0 L -18 6 Z" fill="#0288d1"/>
          <ellipse cx="0" cy="0" rx="10" ry="5.5" fill="#4fc3f7"/>
          <circle cx="5" cy="-1.5" r="1.6" fill="#01579b"/>
        </g></g>
      </g>

      <!-- 曲柄与踏板（JS 驱动） -->
      <line id="crank1" x1="400" y1="338" x2="426" y2="338" stroke="#37474f" stroke-width="7" stroke-linecap="round"/>
      <line id="crank2" x1="400" y1="338" x2="374" y2="338" stroke="#37474f" stroke-width="7" stroke-linecap="round"/>
      <rect id="pedal1" x="416" y="334.5" width="20" height="7" rx="2.5" fill="#263238"/>
      <rect id="pedal2" x="364" y="334.5" width="20" height="7" rx="2.5" fill="#263238"/>

      <!-- 鹈鹕的腿（JS 驱动，踩踏板） -->
      <path id="leg2" d="M 380 222 Q 400 280 374 338" fill="none" stroke="#78909c" stroke-width="8" stroke-linecap="round"/>
      <path id="leg1" d="M 396 214 Q 412 280 426 338" fill="none" stroke="#90a4ae" stroke-width="8" stroke-linecap="round"/>
      <ellipse id="foot2" cx="374" cy="338" rx="9" ry="4.5" fill="#546e7a"/>
      <ellipse id="foot1" cx="426" cy="338" rx="9" ry="4.5" fill="#607d8b"/>

      <!-- 鹈鹕身体组（JS 驱动 bob） -->
      <g id="bodyG">
        <path d="M 346 198 L 320 190 L 330 204 L 316 208 L 344 214 Z" fill="#eceff1" stroke="#cfd8dc" stroke-width="1.5"/>
        <ellipse cx="388" cy="192" rx="50" ry="34" fill="url(#bodyGrad)" stroke="#d7dde3" stroke-width="2" transform="rotate(-12 388 192)"/>
        <!-- 翅膀扶车把 -->
        <g id="wing">
          <path d="M 408 176 Q 452 184 490 199 Q 492 206 484 207 Q 446 200 402 194 Z" fill="#f7f9fa" stroke="#cfd8dc" stroke-width="1.5"/>
          <path d="M 468 196 Q 488 199 491 205 Q 483 210 466 205 Z" fill="#37474f"/>
        </g>
        <!-- 脖子 -->
        <path d="M 416 170 Q 438 148 452 122" fill="none" stroke="#fdfdfd" stroke-width="20" stroke-linecap="round"/>
        <!-- 头 -->
        <g id="headG">
          <circle cx="456" cy="110" r="17" fill="#fdfdfd" stroke="#d7dde3" stroke-width="2"/>
          <g id="pouchG">
            <path d="M 470 114 Q 512 122 550 112 Q 546 150 506 153 Q 477 147 470 114 Z" fill="url(#pouchGrad)" stroke="#f57c00" stroke-width="2"/>
            <path d="M 473 117 Q 510 124 544 115" fill="none" stroke="#e65100" stroke-width="1.5"/>
          </g>
          <path d="M 469 101 L 552 109 L 469 113 Z" fill="#ffb74d" stroke="#f57c00" stroke-width="1.5"/>
          <path d="M 543 107.5 L 552 109 L 543 110.8 Z" fill="#37474f"/>
          <circle cx="459" cy="103" r="4" fill="#263238"/>
          <circle cx="460.5" cy="101.5" r="1.4" fill="#ffffff"/>
          <!-- 红色安全帽 -->
          <path d="M 439 104 A 17 17 0 0 1 473 104 Z" fill="#ef5350" stroke="#c62828" stroke-width="1.5"/>
          <rect x="436" y="102" width="40" height="6" rx="3" fill="#c62828"/>
          <line x1="456" y1="89" x2="456" y2="102" stroke="#ffffff" stroke-width="3"/>
          <circle cx="456" cy="89" r="3" fill="#c62828"/>
        </g>
      </g>
    </svg>
  </div>

<script>
(function () {
  const $ = function (id) { return document.getElementById(id); };
  const spokesRear = $('spokesRear'), spokesFront = $('spokesFront');
  const crank1 = $('crank1'), crank2 = $('crank2');
  const pedal1 = $('pedal1'), pedal2 = $('pedal2');
  const leg1 = $('leg1'), leg2 = $('leg2');
  const foot1 = $('foot1'), foot2 = $('foot2');
  const bodyG = $('bodyG'), wing = $('wing'), headG = $('headG'), pouchG = $('pouchG');

  const BB = { x: 400, y: 338 }, CR = 26;
  const hip1 = { x: 396, y: 214 }, hip2 = { x: 380, y: 222 };

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let a = 0, last = performance.now();

  function frame(t) {
    const dt = Math.min(50, t - last);
    last = t;
    a += dt * (reduced ? 0.0008 : 0.0045);
    const deg = a * 180 / Math.PI;

    spokesRear.setAttribute('transform', 'rotate(' + (deg * 2.5) + ' 275 338)');
    spokesFront.setAttribute('transform', 'rotate(' + (deg * 2.5) + ' 525 338)');

    const f1 = { x: BB.x + CR * Math.cos(a), y: BB.y + CR * Math.sin(a) };
    const f2 = { x: BB.x - CR * Math.cos(a), y: BB.y - CR * Math.sin(a) };

    crank1.setAttribute('x2', f1.x); crank1.setAttribute('y2', f1.y);
    crank2.setAttribute('x2', f2.x); crank2.setAttribute('y2', f2.y);
    pedal1.setAttribute('x', f1.x - 10); pedal1.setAttribute('y', f1.y - 3.5);
    pedal2.setAttribute('x', f2.x - 10); pedal2.setAttribute('y', f2.y - 3.5);

    const bob = Math.sin(a * 2) * 3;
    const h1 = { x: hip1.x, y: hip1.y + bob };
    const h2 = { x: hip2.x, y: hip2.y + bob };
    const k1 = { x: (h1.x + f1.x) / 2 + 24, y: (h1.y + f1.y) / 2 - 8 };
    const k2 = { x: (h2.x + f2.x) / 2 + 24, y: (h2.y + f2.y) / 2 - 8 };
    leg1.setAttribute('d', 'M ' + h1.x + ' ' + h1.y + ' Q ' + k1.x + ' ' + k1.y + ' ' + f1.x + ' ' + f1.y);
    leg2.setAttribute('d', 'M ' + h2.x + ' ' + h2.y + ' Q ' + k2.x + ' ' + k2.y + ' ' + f2.x + ' ' + f2.y);
    foot1.setAttribute('cx', f1.x); foot1.setAttribute('cy', f1.y);
    foot2.setAttribute('cx', f2.x); foot2.setAttribute('cy', f2.y);

    bodyG.setAttribute('transform', 'translate(0 ' + bob + ') rotate(' + (Math.sin(a * 2) * 1.4) + ' 386 205)');
    wing.setAttribute('transform', 'rotate(' + (Math.sin(a * 2 + 0.6) * 7) + ' 408 180)');
    headG.setAttribute('transform', 'rotate(' + (Math.sin(a * 2 + 1.2) * 3.5) + ' 450 122)');
    pouchG.setAttribute('transform', 'rotate(' + (Math.max(0, Math.sin(a * 0.9)) * 6) + ' 470 113)');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
